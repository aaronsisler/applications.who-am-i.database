name: Pull Request
on:
  pull_request:
    branches:
      - main

jobs:
  Pull-Request:
    name: Pull Request
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4

      - name: Set up JDK 21 for x64
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "corretto"
          cache: "maven"

      - name: Current Version
        run: mvn help:evaluate -Dexpression=project.version -q -DforceStdout --no-transfer-progress --batch-mode

      - name: Increment Version
        run: mvn build-helper:parse-version versions:set \
          -DnewVersion=\${parsedVersion.majorVersion}.\${parsedVersion.nextMinorVersion}.\${parsedVersion.incrementalVersion} \
          -DgenerateBackupPoms=false \
          --no-transfer-progress --batch-mode

      - name: New Version
        run: mvn help:evaluate -Dexpression=project.version -q -DforceStdout --no-transfer-progress --batch-mode

      - name: Build with Maven
        run: mvn clean verify --no-transfer-progress --batch-mode --no-transfer-progress --batch-mode
