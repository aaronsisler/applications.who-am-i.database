name: Pull Request
on:
  push:
    branches:
      - main

jobs:
  Build-And-Publish-Artifact:
    name: Build & Publish Artifact
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4

      - name: Set up JDK 21 for x64
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "corretto"
          cache: "maven"

      - name: Increment Version
        run: |
          echo "Current Version:"
          mvn help:evaluate -Dexpression=project.version -q -DforceStdout
          mvn build-helper:parse-version versions:set -DnewVersion=\${parsedVersion.majorVersion}.\$((\${parsedVersion.nextIncrementalVersion})).\${parsedVersion.patchVersion} -DgenerateBackupPoms=false
          echo "New Version:"
          mvn help:evaluate -Dexpression=project.version -q -DforceStdout

      - name: Build with Maven
        run: mvn clean verify --no-transfer-progress --batch-mode

      - name: Publish Artifact
        run: echo "Publishing artifact..."

      - name: Commit Version Bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pom.xml
          git commit -m "Bump version to $(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)" || echo "No changes to commit"
          git push origin HEAD:main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
