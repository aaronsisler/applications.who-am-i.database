name: Publish & Tag Release
on:
  push:
    branches: [main]

jobs:
  Publish-and-Tag-Release:
    name: Publish & Tag Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    concurrency:
      group: release-main
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21 for x64
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "corretto"
          cache: "maven"

      - name: Determine next version
        id: version
        run: |
          LAST=$(git describe --tags --abbrev=0 2>/dev/null || echo "0.0.0")
          LAST=${LAST#v}
          IFS='.' read -r MAJOR MINOR PATCH <<< "$LAST"
          NEXT="$MAJOR.$MINOR.$((PATCH + 1))"
          echo "revision=$NEXT" >> $GITHUB_OUTPUT

      - name: Build & publish
        run: |
          mvn clean deploy \
          -Drevision=${{ steps.version.outputs.revision }} \
          --no-transfer-progress --batch-mode

      - name: Tag release
        run: |
          git tag v${{ steps.version.outputs.revision }}
          git push origin v${{ steps.version.outputs.revision }}
